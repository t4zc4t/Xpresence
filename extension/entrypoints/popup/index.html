<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Xpresence</title>
  </head>
  <body data-air="off">
    <header class="top">
      <span id="cat"></span>
      <div class="brand">
        <h1>Xpresence</h1>
        <p id="air">Off air</p>
      </div>
      <label class="switch" title="Share on Discord">
        <input type="checkbox" id="enabled" />
        <span class="track"></span>
        <span class="sr">Share on Discord</span>
      </label>
    </header>

    <nav class="tabs" role="tablist">
      <button role="tab" id="tab-now" aria-controls="now" aria-selected="true">Now</button>
      <button role="tab" id="tab-sites" aria-controls="sites" aria-selected="false">Sites</button>
      <button role="tab" id="tab-settings" aria-controls="settings" aria-selected="false">Settings</button>
    </nav>

    <main>
      <section id="now" role="tabpanel" aria-labelledby="tab-now"></section>
      <section id="sites" role="tabpanel" aria-labelledby="tab-sites" hidden></section>
      <section id="settings" role="tabpanel" aria-labelledby="tab-settings" hidden></section>
    </main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
