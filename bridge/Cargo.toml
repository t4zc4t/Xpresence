[package]
name = "xpresence-bridge"
version = "0.1.0"
edition = "2024"
description = "Native messaging host that passes Xpresence activity to Discord"
license = "MIT"
repository = "https://github.com/t4zc4t/Xpresence"

[dependencies]
serde_json = "1"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
